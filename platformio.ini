; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s] ; Serial Upload env
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages =
    platformio/tool-esptoolpy @ ~1.40501.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -I include

lib_deps = 
    blynkkk/Blynk@0.6.7
	esp32async/AsyncTCP@3.4.9
	esp32async/ESPAsyncWebServer@3.9.0
	ayushsharma82/WebSerial@2.1.1
	tzapu/WiFiManager@^2.0.17

[env:native] ; Unit Testing env
platform = native
test_framework = unity
build_src_filter = -<*> ; Ignore the hardware-specific main file in /src

[env:nodemcu-32s_ota] ; Over-The-Air Upload env
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -I include

lib_deps = 
    blynkkk/Blynk@0.6.7
	esp32async/AsyncTCP@3.4.9
	esp32async/ESPAsyncWebServer@3.9.0
	ayushsharma82/WebSerial@2.1.1
	tzapu/WiFiManager@^2.0.17

upload_protocol = espota
upload_port = 192.168.5.14 ; Set IP of your esp32

[platformio]
default_envs = esp32-s3_ota ; Set default env

[env:esp32-s3] ; Serial Upload env
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages =
    platformio/tool-esptoolpy @ ~1.40501.0
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

; 1. Keep your file system mapping active
board_build.filesystem = littlefs

; 2. Allocate the full 16MB Flash memory architecture
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_filters = esp32_exception_decoder

; 3. Use the high-speed Quad-Flash and Octal-PSRAM bus combo
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000

; 4. Active compilation flags for Blynk, PSRAM, and standard COM port stability
build_flags = 
    -I include
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -mfix-esp32-psram-cache-issue

; 5. Your exact tank project dependencies
lib_deps = 
    blynkkk/Blynk@0.6.7
    esp32async/AsyncTCP@3.4.9
    esp32async/ESPAsyncWebServer@3.9.0
    ayushsharma82/WebSerial@2.1.1
    tzapu/WiFiManager@^2.0.17

[env:esp32-s3_ota] ; Over-The-Air Upload env
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages =
    platformio/tool-esptoolpy @ ~1.40501.0
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

board_build.filesystem = littlefs

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000

build_flags = 
    -I include
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -mfix-esp32-psram-cache-issue

lib_deps = 
    blynkkk/Blynk@0.6.7
    esp32async/AsyncTCP@3.4.9
    esp32async/ESPAsyncWebServer@3.9.0
    ayushsharma82/WebSerial@2.1.1
    tzapu/WiFiManager@^2.0.17

upload_protocol = espota
upload_port = 192.168.5.14 ; Set IP of your esp32