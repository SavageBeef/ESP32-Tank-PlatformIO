; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s] ; Serial Upload env
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages =
    platformio/tool-esptoolpy @ ~1.40501.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = 
    blynkkk/Blynk@0.6.7
	esp32async/AsyncTCP@3.4.9
	esp32async/ESPAsyncWebServer@3.9.0
	ayushsharma82/WebSerial@2.1.1
	tzapu/WiFiManager@^2.0.17

[env:native] ; Unit Testing env
platform = native
test_framework = unity
build_src_filter = -<*> ; Ignore the hardware-specific main file in /src

[env:nodemcu-32s_ota] ; Over-The-Air Upload env
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

lib_deps = 
    blynkkk/Blynk@0.6.7
	esp32async/AsyncTCP@3.4.9
	esp32async/ESPAsyncWebServer@3.9.0
	ayushsharma82/WebSerial@2.1.1
	tzapu/WiFiManager@^2.0.17

upload_protocol = espota
upload_port = 192.168.5.14 ; Set IP of your esp32

[platformio]
default_envs = nodemcu-32s_ota ; Set default env